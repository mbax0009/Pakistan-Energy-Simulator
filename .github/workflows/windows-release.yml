name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $apiVersion = python -c "from simulator_api.version import VERSION; print(VERSION)"
          if ($apiVersion -ne $version) {
            throw "pyproject.toml version $version does not match simulator_api.version $apiVersion."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version v$version."
          }
      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,package]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build Windows standalone
        shell: pwsh
        run: .\scripts\build_windows_release.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pakistan-Energy-Simulator-v${{ steps.version.outputs.version }}-win-x64
          compression-level: 0
          retention-days: 14
          path: |
            release/Pakistan-Energy-Simulator-v${{ steps.version.outputs.version }}-win-x64.zip
            release/Pakistan-Energy-Simulator-v${{ steps.version.outputs.version }}-win-x64.exe
            release/SHA256SUMS.txt
      - name: Attach tagged GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          files: |
            release/Pakistan-Energy-Simulator-v${{ steps.version.outputs.version }}-win-x64.zip
            release/Pakistan-Energy-Simulator-v${{ steps.version.outputs.version }}-win-x64.exe
            release/SHA256SUMS.txt
