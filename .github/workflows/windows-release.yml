name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,package]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build Windows standalone
        shell: pwsh
        run: .\scripts\build_windows_release.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pakistan-Energy-Simulator-v1.0.0-win-x64
          path: |
            release/Pakistan-Energy-Simulator-v1.0.0-win-x64.zip
            release/Pakistan-Energy-Simulator-v1.0.0-win-x64.exe
            release/SHA256SUMS.txt
      - name: Attach tagged GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Pakistan-Energy-Simulator-v1.0.0-win-x64.zip
            release/Pakistan-Energy-Simulator-v1.0.0-win-x64.exe
            release/SHA256SUMS.txt
