[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistan-energy-simulator"
version = "1.1.1"
description = "Utility-scale renewable-energy techno-economic simulator for Pakistan"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Bin Asad" }]
keywords = [
  "pakistan",
  "renewable-energy",
  "solar-energy",
  "wind-energy",
  "wave-energy",
  "techno-economic-analysis",
  "lcoe",
  "monte-carlo",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://mbax0009.github.io/#work"
Repository = "https://github.com/mbax0009/Pakistan-Energy-Simulator"
Issues = "https://github.com/mbax0009/Pakistan-Energy-Simulator/issues"
Releases = "https://github.com/mbax0009/Pakistan-Energy-Simulator/releases"
Documentation = "https://github.com/mbax0009/Pakistan-Energy-Simulator/tree/main/docs"

[project.optional-dependencies]
wave = ["copernicusmarine>=2.4,<3"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
package = ["pyinstaller>=6.14,<7"]

[project.scripts]
pakistan-energy-simulator = "simulator_api.launcher:main"

[tool.setuptools]
packages = [
  "analysis",
  "core",
  "data",
  "data.assumptions",
  "finance",
  "physics",
  "simulator_api",
]

[tool.setuptools.package-data]
data = [
  "reference/turbines/*.csv",
  "reference/turbines/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp"]
cache_dir = ".pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
